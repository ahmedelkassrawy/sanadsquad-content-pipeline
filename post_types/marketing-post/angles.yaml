# Each service line has one angle, plus cross-service angles that list two `service_lines`
# (reached by topic_id only; they have no focus_terms, so a focus never resolves to them). The vulnerability-class angle is the sole marketing
# exception that may use the KB, and it must cite its listed finding.
angles:
- id: ANGLE-web3-security
  name: web3-security
  service_line: web3-security
  seed_query: web3 security audits deployed-code drift
  focus_terms: [web3, smart contract, evm, solana, svm, protocol design]
  stat_ids:
  - STAT-01
  - STAT-05
- id: ANGLE-pentesting
  name: web2-pentesting
  service_line: pentesting
  seed_query: supply chain key compromise losses
  focus_terms: [web2, pentest, api, cloud, ci/cd, dependency, frontend, infrastructure]
  stat_ids:
  - STAT-02
  - STAT-05
- id: ANGLE-agentic-security
  name: agentic-security-and-red-teaming
  service_line: agentic-security
  seed_query: prompt injection agent signing tools
  focus_terms: [agent, ai, prompt injection, tool abuse, red team, wallet, spending policy]
  stat_ids:
  - STAT-03
  - STAT-05
- id: ANGLE-agentic-payments
  name: agentic-payments-x402-vs-mpp
  service_line: agentic-payments
  seed_query: x402 MPP volume facilitators
  focus_terms: [x402, mpp, payment, facilitator, payment policy]
  stat_ids:
  - STAT-04
  - STAT-05
  preferred_format: thread
- id: ANGLE-vulnerability-class
  name: vulnerability-class
  subject: vulnerability-class
  kb_allowed: true
  service_line: agentic-security
  seed_query: agent tool authorization vulnerability class
