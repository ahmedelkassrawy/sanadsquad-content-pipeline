# Each angle gets its own approved stats, so two marketing posts in one week cannot say the
# same thing. Only the credibility angle states a firm fact; service and credibility invite a review.
# The education angle picks the first KB topic no thread covers that week.
angles:
- id: ANGLE-service
  name: service
  service_line: web3-security
  stat_ids:
  - STAT-04
  - STAT-05
- id: ANGLE-credibility
  name: credibility
  service_line: pentesting
  # Two stats only, matching the post type's max_approved_stats: the audit count and the offer.
  stat_ids:
  - STAT-01
  - STAT-05
- id: ANGLE-education
  name: vulnerability-class
  subject: vulnerability-class
  kb_allowed: true
  service_line: agentic-security
  source_ids:
  - SS-03699
  # No firm stats: the education post ends on its engagement question, not the review offer.
  stat_ids: []
