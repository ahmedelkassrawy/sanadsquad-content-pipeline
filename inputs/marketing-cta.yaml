# Phrases that ask the reader to take a commercial next step.  Ordinary technical imperatives
# are intentionally absent: "check your approvals" is advice, not a CTA.
patterns:
  - '\bbook (?:a |your )?(?:review|assessment|audit|call)\b'
  - '\bschedule (?:a |your )?(?:review|assessment|audit|call)\b'
  - '\bdm us\b'
  - '\breach out (?:to us|today|for (?:a |your )?(?:review|assessment|audit|call))\b'
  - '\bget in touch (?:with us|today)\b'
  - '\btalk to us\b'
  - '\bcontact us\b'
  - '\brequest (?:a |your )?(?:review|assessment|audit)\b'
