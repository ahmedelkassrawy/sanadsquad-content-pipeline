[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "sanadsquad-content-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic", "pyyaml", "rank-bm25", "twitter-text-parser", "setuptools>=75,<81", "genai-prices", "langchain", "langchain-openai", "langchain-google-genai", "langchain-anthropic", "langchain-groq", "langchain-mistralai", "langgraph", "langgraph-checkpoint-sqlite", "pillow", "tavily-python", "ddgs", "trafilatura", "python-dotenv", "httpx"]

[project.optional-dependencies]
dev = ["ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["content_pipeline*", "skills*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
